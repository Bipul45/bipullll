<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Bharti ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: url('bg-image.jpg') no-repeat center center/cover;
  background-attachment: fixed;
  color: black;
}

.overlay {
  padding: 20px;
  max-width: 90%;
  margin: auto;
  white-space: pre-wrap;
  font-size: 16px;
  line-height: 1.6;
}

h2 {
  text-align: center;
}

#introVideo {
  width: 100%;
}

#main-content {
  display: none;
}

.cursor {
  display: inline-block;
  width: 2px;
  background: black;
  margin-left: 2px;
  animation: blink 0.7s infinite;
}

@keyframes blink {
  0% {opacity: 1;}
  50% {opacity: 0;}
  100% {opacity: 1;}
}

.image-gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.image-gallery img {
  width: 45%;
  border-radius: 10px;
}

/* popup */
#lovePopup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  font-size: 20px;
}
</style>
</head>

<body>

<audio id="music" src="birthday-song.mp3" loop></audio>
<audio id="typingSound" src="typing.mp3"></audio>

<video id="introVideo" autoplay>
  <source src="intro-animation.mp4" type="video/mp4">
</video>

<div id="main-content">
  <div class="overlay">
    <h2>Happy Birthday My Love 💕</h2>
    <p id="typedText"></p><span class="cursor"></span>
  </div>

  <div class="image-gallery">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
    <img src="img4.jpg">
  </div>
</div>

<div id="lovePopup">
  <div class="popup-box">
    ❤️ I Love You Bharti ❤️
  </div>
</div>

<script>

const text = `🎉 Happy Birthday meri jaan Bharti 😘💖

Aaj ka din sirf tumhare liye hai...
Tum meri life ki sabse pyari aur special person ho 💕

Tum meri smile ho 😊  
Tum meri happiness ho ✨  
Tum meri duniya ho 🌍  

Jab bhi main tumhe dekhta hoon na...
Dil automatically smile kar deta hai 😍

Main tumse itna pyaar karta hoon ki words me express karna mushkil hai 💞  

Main hamesha tumhare saath rahunga 🤝  
Chahe situation kaisi bhi ho ❤️  

Aur haan...
Next birthday hum saath celebrate karenge 🥳🎂  

Tum meri ho... aur hamesha rahogi 💖  

I love you sooo much Bharti 😘💞  
Forever and ever ♾❤️`;

let i = 0;

function typeWriter() {
  if (i < text.length) {
    document.getElementById("typedText").innerHTML += text.charAt(i);

    let sound = document.getElementById("typingSound");
    sound.currentTime = 0;
    sound.play();

    i++;
    window.scrollTo(0, document.body.scrollHeight);

    setTimeout(typeWriter, 30);
  } else {
    // typing complete → popup show
    setTimeout(() => {
      document.getElementById("lovePopup").style.display = "flex";
    }, 1000);
  }
}

const video = document.getElementById("introVideo");

video.onended = function() {
  video.style.display = "none";
  document.getElementById("main-content").style.display = "block";

  document.getElementById("music").play();

  typeWriter();
};

</script>

</body>
</html>
